<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Log text is untrusted: nothing from a log is ever inserted as HTML, and this
     policy blocks loading anything from outside the app. ('unsafe-eval' is needed
     by pywebview's own Python<->JS bridge.) -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src data:; connect-src 'self'">
<title>cw-lens</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --sidebar: #eef0f3; --sidebar-hover: #e3e6eb;
  --border: #e2e5ea; --border-strong: #cfd4dc; --text: #171a1f; --muted: #646d7a; --faint: #8d95a1;
  --accent: #4f46e5; --accent-hover: #4338ca; --accent-soft: #eceafd; --accent-text: #3730a3;
  --row-hover: #f3f5f8; --row-selected: #eceafd; --mark: #fde68a; --mark-text: #3b2f00;
  --danger-bg: #fdecec; --danger-text: #9b1c1c; --danger-border: #f5c2c2;
  --warn-bg: #fff6e0; --warn-text: #7a4b00;
  --shadow: 0 10px 30px rgba(15, 20, 30, .14), 0 2px 6px rgba(15, 20, 30, .08);
  --b-red-bg: #fde2e2; --b-red: #a61b1b; --b-amber-bg: #fdefc8; --b-amber: #7c4a03;
  --b-green-bg: #dcf5e4; --b-green: #146c34; --b-blue-bg: #e0ecff; --b-blue: #1d4fa8;
  --b-purple-bg: #efe4ff; --b-purple: #6331b5; --b-gray-bg: #eceef1; --b-gray: #4b5462;
  --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --panel: #161a20; --sidebar: #12151a; --sidebar-hover: #1d222a;
    --border: #252b34; --border-strong: #343b46; --text: #e7e9ec; --muted: #9aa3b0; --faint: #6f7886;
    --accent: #7c75ff; --accent-hover: #918bff; --accent-soft: #24224a; --accent-text: #c9c6ff;
    --row-hover: #1b2028; --row-selected: #24224a; --mark: #6b5310; --mark-text: #fff3c4;
    --danger-bg: #3a1618; --danger-text: #ffb4b4; --danger-border: #5c2427;
    --warn-bg: #3a2c0c; --warn-text: #ffd889;
    --shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .4);
    --b-red-bg: #45191b; --b-red: #ffaaa8; --b-amber-bg: #43320c; --b-amber: #ffd27a;
    --b-green-bg: #12361f; --b-green: #8be0a8; --b-blue-bg: #15294a; --b-blue: #9cc2ff;
    --b-purple-bg: #2c1d4d; --b-purple: #cdb2ff; --b-gray-bg: #232931; --b-gray: #b4bcc8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --panel: #161a20; --sidebar: #12151a; --sidebar-hover: #1d222a;
  --border: #252b34; --border-strong: #343b46; --text: #e7e9ec; --muted: #9aa3b0; --faint: #6f7886;
  --accent: #7c75ff; --accent-hover: #918bff; --accent-soft: #24224a; --accent-text: #c9c6ff;
  --row-hover: #1b2028; --row-selected: #24224a; --mark: #6b5310; --mark-text: #fff3c4;
  --danger-bg: #3a1618; --danger-text: #ffb4b4; --danger-border: #5c2427;
  --warn-bg: #3a2c0c; --warn-text: #ffd889;
  --shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .4);
  --b-red-bg: #45191b; --b-red: #ffaaa8; --b-amber-bg: #43320c; --b-amber: #ffd27a;
  --b-green-bg: #12361f; --b-green: #8be0a8; --b-blue-bg: #15294a; --b-blue: #9cc2ff;
  --b-purple-bg: #2c1d4d; --b-purple: #cdb2ff; --b-gray-bg: #232931; --b-gray: #b4bcc8;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 13.5px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.app { display: grid; grid-template-columns: 232px 1fr auto; height: 100vh; }

/* ---------- sidebar ---------- */
.sidebar { background: var(--sidebar); border-right: 1px solid var(--border); display: flex;
           flex-direction: column; padding: 14px 10px; gap: 2px; overflow-y: auto; min-height: 0; }
.brand { display: flex; align-items: center; gap: 9px; padding: 4px 8px 16px; font-weight: 650;
         font-size: 15px; letter-spacing: -.01em; }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: #fff;
              display: grid; place-items: center; }
.brand-mark svg { width: 15px; height: 15px; stroke-width: 2.2; }
.section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
                 color: var(--faint); padding: 14px 8px 6px; }
.nav-item { display: flex; align-items: center; gap: 9px; width: 100%; border: 0; background: none;
            text-align: left; padding: 7px 8px; border-radius: 7px; color: var(--muted); }
.nav-item:hover { background: var(--sidebar-hover); color: var(--text); }
.nav-item.active { background: var(--panel); color: var(--text); font-weight: 560;
                   box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 0 0 1px var(--border); }
.nav-item .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-item .dot { width: 7px; height: 7px; border-radius: 50%; background: #e0a100; flex: none; }
.saved .nav-item { font-size: 13px; padding: 6px 8px 6px 10px; }
.saved .nav-item svg { width: 14px; height: 14px; opacity: .7; }
.saved-empty { color: var(--faint); font-size: 12.5px; padding: 4px 10px; }
.spacer { flex: 1; min-height: 16px; }
.foot { border-top: 1px solid var(--border); padding-top: 8px; display: flex; flex-direction: column; gap: 2px; }
.foot .sub { font-size: 11.5px; color: var(--faint); }

/* ---------- main ---------- */
main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { padding: 16px 20px 10px; display: flex; flex-direction: column; gap: 10px;
       border-bottom: 1px solid var(--border); background: var(--panel); }
.title-row { display: flex; align-items: baseline; gap: 10px; }
.title-row h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
.title-row .groups { color: var(--faint); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis;
                     white-space: nowrap; min-width: 0; }
.title-row .groups button { border: 0; background: none; color: var(--accent); padding: 0; font-size: 12.5px; }
.searchbar { display: flex; gap: 8px; align-items: stretch; }
.search { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--bg);
          border: 1px solid var(--border-strong); border-radius: 9px; padding: 0 10px; min-width: 0; }
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search > svg { color: var(--faint); }
.search input { flex: 1; border: 0; background: none; outline: none; padding: 9px 0; min-width: 0; font-size: 14px; }
.kbd { font: 11px var(--mono); color: var(--faint); border: 1px solid var(--border-strong);
       border-radius: 4px; padding: 0 5px; }
.pill { display: inline-flex; align-items: center; gap: 5px; background: var(--accent-soft);
        color: var(--accent-text); border-radius: 6px; padding: 2px 4px 2px 8px; font-size: 12.5px;
        font-weight: 560; white-space: nowrap; }
.pill button { border: 0; background: none; color: inherit; padding: 1px; border-radius: 4px; display: grid; }
.pill button:hover { background: rgba(127,127,127,.18); }
.pill svg { width: 13px; height: 13px; }
select, .input { background: var(--panel); border: 1px solid var(--border-strong); border-radius: 8px;
                 padding: 7px 10px; }
select { padding: 0 26px 0 10px; height: 36px; }
.filters select { height: 30px; font-size: 12.5px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border-strong);
       background: var(--panel); border-radius: 8px; padding: 7px 12px; font-weight: 520; white-space: nowrap; }
.btn:hover { background: var(--row-hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; padding: 7px 18px; }
.btn.primary:hover { background: var(--accent-hover); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.ghost:hover { background: var(--row-hover); color: var(--text); }
.btn.on { color: var(--accent-text); background: var(--accent-soft); border-color: transparent; }
.btn:disabled { opacity: .55; cursor: default; }
.dates { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; flex-wrap: wrap; }
.filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.filters .lbl { color: var(--faint); font-size: 12.5px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--border-strong); background: var(--panel); border-radius: 999px;
        padding: 3px 11px; font-size: 12.5px; color: var(--muted); }
.chip:hover { color: var(--text); border-color: var(--faint); }
.chip.active { background: var(--text); color: var(--panel); border-color: var(--text); }
.chips.disabled { opacity: .45; pointer-events: none; }
.grow { flex: 1; }
.query-panel textarea { width: 100%; min-height: 128px; resize: vertical; font: 12.5px/1.5 var(--mono);
                        background: var(--bg); border: 1px solid var(--border-strong); border-radius: 8px;
                        padding: 10px 12px; outline: none; }
.query-panel textarea:focus { border-color: var(--accent); }
.query-note { font-size: 12px; color: var(--faint); margin-top: 4px; display: flex; gap: 8px; align-items: center; }
.query-note button { border: 0; background: none; color: var(--accent); padding: 0; font-size: 12px; }
.banner { margin: 12px 20px 0; padding: 10px 12px; border-radius: 8px; background: var(--danger-bg);
          color: var(--danger-text); border: 1px solid var(--danger-border); display: flex; gap: 10px;
          align-items: flex-start; white-space: pre-wrap; }
.banner svg { margin-top: 2px; }
.banner .msg { flex: 1; }
.banner button { border: 0; background: none; color: inherit; padding: 0; display: grid; }

/* ---------- results ---------- */
.results { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.results-head { display: flex; align-items: center; gap: 12px; padding: 10px 20px; min-height: 48px; }
.results-head .count { font-weight: 600; }
.results-head .meta { color: var(--faint); font-size: 12.5px; }
.results-head .warn { background: var(--warn-bg); color: var(--warn-text); font-size: 12px;
                      padding: 2px 8px; border-radius: 6px; }
.table-wrap { flex: 1; overflow: auto; min-height: 0; border-top: 1px solid var(--border); background: var(--panel); }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
th { position: sticky; top: 0; z-index: 1; background: var(--panel); text-align: left; font-weight: 560;
     font-size: 11.5px; color: var(--faint); text-transform: uppercase; letter-spacing: .04em;
     padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; max-width: 380px;
     overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
td.time { color: var(--muted); font-variant-numeric: tabular-nums; width: 1%; }
td.msg { font: 12.5px var(--mono); max-width: none; width: 100%; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--row-hover); }
tbody tr.selected td { background: var(--row-selected); }
th:first-child, td:first-child { padding-left: 20px; }
mark { background: var(--mark); color: var(--mark-text); border-radius: 3px; padding: 0 1px; }
.badge { display: inline-block; font-size: 11px; font-weight: 650; letter-spacing: .02em; padding: 1px 7px;
         border-radius: 5px; text-transform: uppercase; white-space: nowrap; }
.b-red { background: var(--b-red-bg); color: var(--b-red); }
.b-amber { background: var(--b-amber-bg); color: var(--b-amber); }
.b-green { background: var(--b-green-bg); color: var(--b-green); }
.b-blue { background: var(--b-blue-bg); color: var(--b-blue); }
.b-purple { background: var(--b-purple-bg); color: var(--b-purple); }
.b-gray { background: var(--b-gray-bg); color: var(--b-gray); }

.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
         gap: 10px; padding: 56px 24px; color: var(--muted); }
.empty .icon { width: 46px; height: 46px; border-radius: 12px; background: var(--accent-soft); color: var(--accent);
               display: grid; place-items: center; }
.empty .icon svg { width: 22px; height: 22px; }
.empty h2 { margin: 4px 0 0; font-size: 15px; color: var(--text); font-weight: 620; }
.empty p { margin: 0; max-width: 440px; }
.suggestions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
.spinner { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent;
           border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.skeleton td div { height: 10px; border-radius: 4px; background: var(--row-hover);
                   animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }

/* ---------- details drawer ---------- */
.details { width: 420px; border-left: 1px solid var(--border); background: var(--panel); display: flex;
           flex-direction: column; min-height: 0; }
.details[hidden] { display: none; }
.details-head { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-start; }
.details-head .t { flex: 1; min-width: 0; }
.details-head .t .when { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.details-head .t .subject { font-weight: 600; margin-top: 6px; overflow-wrap: anywhere; }
.icon-btn { border: 0; background: none; color: var(--muted); border-radius: 6px; padding: 5px; display: grid; }
.icon-btn:hover { background: var(--row-hover); color: var(--text); }
.details-body { overflow: auto; padding: 8px 16px 16px; flex: 1; }
.kv { display: grid; grid-template-columns: 104px 1fr; gap: 0 12px; }
.kv dt { color: var(--faint); font-size: 12px; padding: 7px 0; border-bottom: 1px solid var(--border); }
.kv dd { margin: 0; padding: 7px 0; border-bottom: 1px solid var(--border); overflow-wrap: anywhere; }
.kv dd .copy { visibility: hidden; margin-left: 6px; border: 0; background: none; color: var(--faint); padding: 0; vertical-align: middle; }
.kv dd:hover .copy { visibility: visible; }
.kv dd .copy svg { width: 13px; height: 13px; }
.raw-head { display: flex; align-items: center; justify-content: space-between; margin: 16px 0 6px;
            color: var(--faint); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; font-weight: 560; }
.ctx { margin-top: 0; border: 1px solid var(--border); border-radius: 8px; background: var(--bg);
       font: 12px/1.5 var(--mono); max-height: 420px; overflow: auto; }
.ctx-line { display: grid; grid-template-columns: 92px 1fr; gap: 8px; padding: 1px 10px; }
.ctx-line .t { color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ctx-line .m { white-space: pre-wrap; overflow-wrap: anywhere; }
.ctx-line.hit { background: var(--accent-soft); color: var(--accent-text); }
.ctx-line.exc .m { color: var(--b-red); font-weight: 600; }
.ctx-status { padding: 10px 12px; color: var(--muted); font-family: inherit; font-size: 12.5px; }
.ctx-status .btn { margin-top: 6px; }
pre.raw { margin: 0; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
          font: 12px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }

/* ---------- modal & toast ---------- */
.overlay { position: fixed; inset: 0; background: rgba(10, 12, 16, .45); display: grid; place-items: center; z-index: 20; padding: 16px; }
.overlay[hidden] { display: none; }
.modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow);
         width: min(560px, 100%); max-height: min(640px, 92vh); display: flex; flex-direction: column; }
.modal header { padding: 16px 18px 6px; }
.modal header h3 { margin: 0; font-size: 15px; }
.modal header p { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; }
.modal .body { padding: 10px 18px; overflow: auto; flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.modal footer { padding: 12px 18px 16px; display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.modal footer .note { margin-right: auto; color: var(--faint); font-size: 12.5px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12.5px; color: var(--muted); font-weight: 520; }
.field .help { font-size: 12px; color: var(--faint); }
.group-list { border: 1px solid var(--border); border-radius: 8px; overflow: auto; min-height: 220px; max-height: 340px; }
.group-row { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-bottom: 1px solid var(--border);
             cursor: pointer; font: 12.5px var(--mono); }
.group-row:last-child { border-bottom: 0; }
.group-row:hover { background: var(--row-hover); }
.group-row input { accent-color: var(--accent); margin: 0; }
.group-status { padding: 18px; color: var(--muted); text-align: center; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text);
         color: var(--panel); padding: 8px 14px; border-radius: 8px; box-shadow: var(--shadow); z-index: 30;
         font-size: 13px; max-width: 80vw; }
.toast[hidden] { display: none; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg></span>cw-lens</div>
    <div class="section-label">Logs</div>
    <nav id="sources"></nav>
    <div class="section-label">Saved searches</div>
    <nav id="saved" class="saved"></nav>
    <div class="spacer"></div>
    <div class="foot">
      <button class="nav-item" id="groupsBtn"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="label">Log groups</span></button>
      <button class="nav-item" id="settingsBtn"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg><span class="label">AWS settings<div class="sub" id="awsSub"></div></span></button>
      <button class="nav-item" id="themeBtn"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg><span class="label" id="themeLabel">Theme: auto</span></button>
    </div>
  </aside>

  <main>
    <div class="top">
      <div class="title-row">
        <h1 id="title">Logs</h1>
        <span class="groups" id="groupsLine"></span>
      </div>
      <div class="searchbar">
        <label class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span id="savedPill" class="pill" hidden><span id="savedPillText"></span><button id="savedPillClear" title="Back to normal search"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></span>
          <input id="term" autocomplete="off" spellcheck="false" placeholder="Search">
          <span class="kbd">/</span>
        </label>
        <select id="range" title="Time range"></select>
        <button class="btn primary" id="runBtn">Search</button>
      </div>
      <div class="dates" id="dates" hidden>
        From <input class="input" type="datetime-local" id="dateFrom">
        to <input class="input" type="datetime-local" id="dateTo">
        <span>your local time · leave “to” empty for now</span>
      </div>
      <div class="filters">
        <span class="lbl">Show</span>
        <div class="chips" id="levels"></div>
        <span class="grow"></span>
        <span class="lbl">Limit</span>
        <select id="limit" title="Maximum rows"><option>100</option><option selected>200</option><option>1000</option><option>10000</option></select>
        <button class="btn ghost" id="queryToggle"><svg viewBox="0 0 24 24"><path d="m8 8-4 4 4 4M16 8l4 4-4 4"/></svg>Query</button>
      </div>
      <div class="query-panel" id="queryPanel" hidden>
        <textarea id="queryText" spellcheck="false"></textarea>
        <div class="query-note" id="queryNote"></div>
      </div>
    </div>
    <div class="banner" id="banner" hidden>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
      <div class="msg" id="bannerMsg"></div>
      <button id="bannerClose" title="Dismiss"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <section class="results">
      <div class="results-head" id="resultsHead" hidden>
        <span class="count" id="count"></span>
        <span class="meta" id="meta"></span>
        <span class="warn" id="limitWarn" hidden></span>
        <span class="grow"></span>
        <button class="btn" id="exportBtn"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Export CSV</button>
      </div>
      <div class="table-wrap" id="tableWrap">
        <table id="table"></table>
        <div id="empty"></div>
      </div>
    </section>
  </main>

  <aside class="details" id="details" hidden>
    <div class="details-head">
      <div class="t" id="detailsTitle"></div>
      <button class="icon-btn" id="detailsClose" title="Close (Esc)"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="details-body" id="detailsBody"></div>
  </aside>
</div>

<div class="overlay" id="overlay" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const ICONS = {
  email: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  ims: '<svg viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5V8Z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>',
  other: '<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>',
  custom: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  saved: '<svg viewBox="0 0 24 24"><path d="M6 4h12v16l-6-4-6 4V4Z"/></svg>',
  search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  alert: '<svg viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v4M12 17h.01"/></svg>',
  copy: '<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
};

const S = {
  state: null, source: null, saved: null, level: "Any", rows: [], cols: [], highlight: [],
  queryEdited: false, selected: -1, busy: false, theme: "auto",
};

// ---------- small helpers ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem("cwlens." + k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("cwlens." + k, v); } catch { /* storage unavailable */ } },
};
function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;          // only ever used with our own icon markup
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null) n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return n;
}
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.timer); toast.timer = setTimeout(() => (t.hidden = true), 2600);
}
function showError(msg) { $("bannerMsg").textContent = msg; $("banner").hidden = false; }
function clearError() { $("banner").hidden = true; }
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch {
    const ta = el("textarea", { style: "position:fixed;opacity:0" }); ta.value = text; document.body.append(ta);
    ta.select(); document.execCommand("copy"); ta.remove(); toast("Copied");
  }
}
function parseTime(v) {
  if (!v) return null;
  const d = new Date(String(v).replace(" ", "T") + (/[zZ]|[+-]\d\d:?\d\d$/.test(v) ? "" : "Z"));
  return isNaN(d) ? null : d;
}
function fmtTime(d, withYear) {
  const opts = { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false };
  if (withYear) opts.year = "numeric";
  return d.toLocaleString(undefined, opts);
}
function fmtDay(d) { return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }); }

// Colour for an SES event type or a log level.
function badgeClass(v) {
  const s = String(v).toLowerCase();
  if (/bounce|complaint|reject|failure|error|fatal|critical|exception/.test(s)) return "b-red";
  if (/delay|warn/.test(s)) return "b-amber";
  if (/^delivery$|delivered|success/.test(s)) return "b-green";
  if (/send|info/.test(s)) return "b-blue";
  if (/open|click|subscription/.test(s)) return "b-purple";
  return "b-gray";
}
function badge(v) { return el("span", { class: "badge " + badgeClass(v) }, v); }
function levelOf(msg) {
  const m = String(msg || "");
  if (/\b(fatal|error|exception|traceback)\b/i.test(m)) return "Error";
  if (/\bwarn(ing)?\b/i.test(m)) return "Warn";
  if (/\binfo\b/i.test(m)) return "Info";
  if (/\bdebug\b/i.test(m)) return "Debug";
  return "";
}
// Append text to a node, wrapping search-term matches in <mark> (as DOM nodes, never HTML).
function withHighlight(text, terms) {
  const frag = document.createDocumentFragment();
  text = String(text ?? "");
  if (!terms.length) { frag.append(text); return frag; }
  const re = new RegExp("(" + terms.map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
  let last = 0;
  for (const m of text.matchAll(re)) {
    if (m.index > last) frag.append(text.slice(last, m.index));
    frag.append(el("mark", {}, m[0]));
    last = m.index + m[0].length;
  }
  if (last < text.length) frag.append(text.slice(last));
  return frag;
}

// ---------- state & rendering ----------
const src = () => S.state.sources.find((s) => s.key === S.source) || S.state.sources[0];
function iconFor(s) { return s.key === "__custom__" ? ICONS.custom : ICONS[s.key] || ICONS.other; }

function renderSidebar() {
  const nav = $("sources"); nav.replaceChildren();
  for (const s of S.state.sources) {
    const b = el("button", { class: "nav-item" + (s.key === S.source ? " active" : ""), title: s.log_groups.join("\n") || "No log groups chosen yet",
      onclick: () => selectSource(s.key) });
    b.append(el("span", { html: iconFor(s), style: "display:grid" }), el("span", { class: "label" }, s.label));
    if (!s.log_groups.length) b.append(el("span", { class: "dot", title: "No log groups chosen yet" }));
    nav.append(b);
  }
  const saved = $("saved"); saved.replaceChildren();
  const list = src().saved;
  if (!list.length) saved.append(el("div", { class: "saved-empty" }, "None for this source"));
  for (const q of list) {
    saved.append(el("button", { class: "nav-item" + (S.saved === q.name ? " active" : ""), title: q.name + (q.needs_term ? "\nUses the text in the search box" : ""),
      onclick: () => selectSaved(q.name) }, el("span", { html: ICONS.saved, style: "display:grid" }), el("span", { class: "label" }, q.name)));
  }
  $("awsSub").textContent = S.state.region + (S.state.profile ? " · " + S.state.profile : " · default login");
}

function renderTop() {
  const s = src();
  $("title").textContent = s.label;
  const gl = $("groupsLine"); gl.replaceChildren();
  if (s.log_groups.length) gl.append(s.log_groups.join(", ") + "  ", el("button", { onclick: openGroups }, "Change"));
  else gl.append(el("button", { onclick: openGroups }, "Choose log groups →"));
  $("term").placeholder = "Search " + s.search_hint;
  const pill = $("savedPill");
  pill.hidden = !S.saved;
  $("savedPillText").textContent = S.saved ? "Saved: " + S.saved : "";
  const lv = $("levels"); lv.replaceChildren();
  for (const name of s.levels) {
    lv.append(el("button", { class: "chip" + (name === S.level ? " active" : ""), onclick: () => { S.level = name; renderTop(); refreshPreview(); } }, name === "Any" ? "All" : name));
  }
  lv.classList.toggle("disabled", !!S.saved || S.queryEdited);
  $("dates").hidden = $("range").value !== "Custom dates";
}

function renderEmpty(kind) {
  const box = $("empty"); box.replaceChildren(); $("table").replaceChildren();
  const s = src();
  const card = el("div", { class: "empty" });
  if (kind === "needGroups") {
    card.append(el("div", { class: "icon", html: ICONS.alert }), el("h2", {}, "Choose log groups for " + s.label),
      el("p", {}, "Pick which CloudWatch log groups this search should read. You only need to do this once."),
      el("div", { class: "suggestions" }, el("button", { class: "btn primary", onclick: openGroups }, "Choose log groups")));
  } else if (kind === "none") {
    card.append(el("div", { class: "icon", html: ICONS.search }), el("h2", {}, "No matching logs"),
      el("p", {}, "Nothing matched in this time range. Try a longer range, fewer words, or “All” instead of a filter."));
  } else {
    card.append(el("div", { class: "icon", html: iconFor(s) }), el("h2", {}, "Search " + s.label + " logs"),
      el("p", {}, "Type " + s.search_hint + " and press Enter. Or start from a saved search:"));
    const sug = el("div", { class: "suggestions" });
    for (const q of s.saved.filter((q) => !q.needs_term).slice(0, 4)) sug.append(el("button", { class: "btn", onclick: () => { selectSaved(q.name); run(); } }, q.name));
    if (sug.children.length) card.append(sug);
  }
  box.append(card);
  $("resultsHead").hidden = true;
}

function renderSkeleton() {
  $("empty").replaceChildren();
  const t = $("table"); t.replaceChildren();
  const tb = el("tbody", { class: "skeleton" });
  for (let i = 0; i < 8; i++) tb.append(el("tr", {}, [140, 70, 260, 420].map((w) => el("td", {}, el("div", { style: `width:${w * (0.6 + ((i * 7 + w) % 5) / 10)}px` })))));
  t.append(tb);
}

// Which columns go in the table; the rest are shown in the details panel.
function tableColumns(rows) {
  // Keep the source's display order (CloudWatch leaves out empty fields per row).
  const all = [...(src().columns || [])].filter((c) => rows.some((r) => c in r));
  for (const r of rows) for (const k of Object.keys(r)) if (!all.includes(k)) all.push(k);
  const friendly = all.filter((c) => !c.startsWith("@"));
  let cols = all.filter((c) => !["@logStream", "@log", "@ptr", "MessageId", "Stream"].includes(c));
  if (friendly.length) cols = cols.filter((c) => c !== "@message");
  const timeCol = cols.find((c) => c === "Timestamp" || c === "@timestamp");
  const rest = cols.filter((c) => c !== timeCol);
  const out = timeCol ? [timeCol] : [];
  if (!cols.includes("Event") && !cols.includes("Level") && rows.some((r) => levelOf(r["@message"]))) out.push("__level");
  return out.concat(rest);
}
const COL_TITLE = { "@timestamp": "Time", Timestamp: "Time", "@message": "Message", __level: "Level" };

function renderTable() {
  $("empty").replaceChildren();
  const t = $("table"); t.replaceChildren();
  const cols = S.cols;
  const years = new Set(S.rows.map((r) => (parseTime(r.Timestamp || r["@timestamp"]) || new Date()).getFullYear()));
  const withYear = years.size > 1 || !years.has(new Date().getFullYear());
  t.append(el("thead", {}, el("tr", {}, cols.map((c) => el("th", {}, COL_TITLE[c] || c)))));
  const tb = el("tbody");
  S.rows.forEach((r, i) => {
    const tr = el("tr", { class: i === S.selected ? "selected" : "", onclick: () => openDetails(i) });
    for (const c of cols) {
      if (c === "Timestamp" || c === "@timestamp") {
        const d = parseTime(r[c]);
        tr.append(el("td", { class: "time", title: (r[c] || "") + " UTC" }, d ? fmtTime(d, withYear) : r[c] || ""));
      } else if (c === "Event" || c === "Level") {
        tr.append(el("td", {}, r[c] ? badge(r[c]) : ""));
      } else if (c === "__level") {
        const lv = levelOf(r["@message"]);
        tr.append(el("td", {}, lv ? badge(lv) : ""));
      } else {
        const td = el("td", { class: c === "@message" || c === "Message" ? "msg" : "", title: r[c] || "" });
        td.append(withHighlight(r[c] ?? "", S.highlight));
        tr.append(td);
      }
    }
    tb.append(tr);
  });
  t.append(tb);
}

function openDetails(i) {
  S.selected = i;
  document.querySelectorAll("#table tbody tr").forEach((tr, j) => tr.classList.toggle("selected", j === i));
  const r = S.rows[i];
  const d = parseTime(r.Timestamp || r["@timestamp"]);
  const title = $("detailsTitle"); title.replaceChildren();
  const ev = r.Event || r.Level || levelOf(r["@message"]);
  if (ev) title.append(badge(ev));
  title.append(el("div", { class: "when" }, d ? `${fmtTime(d, true)}  ·  ${(r.Timestamp || r["@timestamp"])} UTC` : ""));
  const headline = r.Subject || (r.Message || r["@message"] || "").slice(0, 160);
  if (headline) title.append(el("div", { class: "subject" }, headline));

  const body = $("detailsBody"); body.replaceChildren();
  const kv = el("dl", { class: "kv" });
  for (const [k, v] of Object.entries(r)) {
    if (k === "@message" || k === "@ptr" || k === "@log" || v === "" || v == null) continue;
    kv.append(el("dt", {}, COL_TITLE[k] || k),
      el("dd", {}, withHighlight(v, S.highlight), el("button", { class: "copy", title: "Copy", html: ICONS.copy, onclick: () => copy(String(v)) })));
  }
  body.append(kv);
  if (r["@message"]) {
    let raw = r["@message"];
    try { raw = JSON.stringify(JSON.parse(raw), null, 2); } catch { /* not JSON */ }
    body.append(el("div", { class: "raw-head" }, "Raw log line", el("button", { class: "btn ghost", onclick: () => copy(raw) }, el("span", { html: ICONS.copy, style: "display:grid" }), "Copy")));
    const pre = el("pre", { class: "raw" }); pre.append(withHighlight(raw, S.highlight));
    body.append(pre);
  }
  if (r["@logStream"] || r.Stream) body.append(contextSection(r, i));
  $("details").hidden = false;
}

// Lines logged just before/after this one in the same stream. Python tracebacks
// arrive as one CloudWatch event per line, so this shows the whole traceback.
function contextSection(r, i) {
  const wrap = el("div");
  const head = el("div", { class: "raw-head" }, "Surrounding lines");
  const box = el("div", { class: "ctx" });
  wrap.append(head, box);
  const msg = r.Message || r["@message"] || "";
  const looksLikeError = /^(ERROR|CRITICAL)$/.test(r.Level || "") ||
    /Traceback \(most recent call last\)|(Error|Exception)(: |$)|^\s*File "/.test(msg);
  const load = async () => {
    box.replaceChildren(el("div", { class: "ctx-status" }, el("span", { class: "spinner", style: "display:inline-block;vertical-align:middle" }), "  Loading lines around this one…"));
    const res = await window.pywebview.api.context(S.source, r);
    if (S.selected !== i) return;  // user moved on to another row
    if (res.error) { box.replaceChildren(el("div", { class: "ctx-status" }, res.error)); return; }
    if (!res.lines.length) { box.replaceChildren(el("div", { class: "ctx-status" }, "No other lines were logged around this one.")); return; }
    box.replaceChildren();
    const raw = r["@message"] || "";
    let hitEl = null;
    for (const ln of res.lines) {
      const d = parseTime(ln.time);
      const hit = ln.message === raw;
      const exc = /^\s*[A-Za-z_][\w.]*(Error|Exception)(: |$)/.test(ln.message);
      const row = el("div", { class: "ctx-line" + (hit ? " hit" : "") + (exc ? " exc" : "") },
        el("span", { class: "t", title: ln.time + " UTC" }, d ? d.toLocaleTimeString(undefined, { hour12: false }) + "." + ln.time.slice(-3) : ""),
        el("span", { class: "m" }, withHighlight(ln.message, S.highlight)));
      if (hit && !hitEl) hitEl = row;
      box.append(row);
    }
    head.replaceChildren("Surrounding lines", el("button", { class: "btn ghost", onclick: () => copy(res.lines.map((l) => l.message).join("\n")) },
      el("span", { html: ICONS.copy, style: "display:grid" }), "Copy all"));
    if (hitEl) hitEl.scrollIntoView({ block: "nearest" });
  };
  if (looksLikeError) load();
  else box.append(el("div", { class: "ctx-status" }, "See what was logged just before and after this line.",
    el("div", {}, el("button", { class: "btn", onclick: load }, "Show surrounding lines"))));
  return wrap;
}
function closeDetails() {
  $("details").hidden = true; S.selected = -1;
  document.querySelectorAll("#table tbody tr.selected").forEach((tr) => tr.classList.remove("selected"));
}

// ---------- actions ----------
function params() {
  return {
    source: S.source, mode: S.queryEdited ? "query" : S.saved ? "saved" : "simple",
    term: $("term").value, level: S.level, limit: Number($("limit").value), saved: S.saved || "",
    query: $("queryText").value, range: $("range").value, from: $("dateFrom").value, to: $("dateTo").value,
  };
}
let previewTimer;
function refreshPreview() {
  if (S.queryEdited) return;
  clearTimeout(previewTimer);
  previewTimer = setTimeout(async () => {
    const res = await window.pywebview.api.preview(params());
    if (!S.queryEdited) $("queryText").value = res.query || "";
  }, 200);
}
function setQueryEdited(on) {
  S.queryEdited = on;
  const note = $("queryNote"); note.replaceChildren();
  if (on) note.append("Edited — this query runs exactly as written.", el("button", { onclick: () => { setQueryEdited(false); refreshPreview(); renderTop(); } }, "Reset"));
  else note.append("This is the CloudWatch Logs Insights query your search runs. Edit it to customise; Ctrl+Enter runs it.");
  renderTop();
}
function selectSource(key) {
  S.source = key; S.saved = null; S.level = "Any"; store.set("source", key);
  setQueryEdited(false); renderSidebar(); renderTop(); closeDetails(); clearError(); refreshPreview();
  S.rows = []; renderEmpty(src().log_groups.length ? "start" : "needGroups");
}
function selectSaved(name) {
  S.saved = S.saved === name ? null : name;
  setQueryEdited(false); renderSidebar(); renderTop(); refreshPreview();
  const q = src().saved.find((x) => x.name === name);
  if (S.saved && q && q.needs_term && !$("term").value.trim()) { $("term").focus(); toast("Type what to search for, then press Enter"); }
}

async function run() {
  if (S.busy) return;
  const s = src();
  if (!s.log_groups.length) { renderEmpty("needGroups"); return; }
  const q = S.saved && s.saved.find((x) => x.name === S.saved);
  if (q && q.needs_term && !$("term").value.trim() && !S.queryEdited) { $("term").focus(); showError("This saved search needs something to look for — type it in the search box."); return; }
  S.busy = true; clearError(); closeDetails();
  const btn = $("runBtn"); btn.disabled = true;
  const began = Date.now();
  const tick = () => { btn.replaceChildren(el("span", { class: "spinner" }), ` ${Math.floor((Date.now() - began) / 1000)}s`); };
  tick(); const timer = setInterval(tick, 1000);
  renderSkeleton(); $("resultsHead").hidden = true;
  try {
    const p = params();
    const res = await window.pywebview.api.run(p);
    if (res.error) {
      if (res.need_groups) renderEmpty("needGroups"); else { showError(res.error); renderEmpty("start"); }
      return;
    }
    if (!S.queryEdited) $("queryText").value = res.query;
    S.rows = res.rows; S.highlight = S.queryEdited ? [] : p.term.split(/\s+/).filter(Boolean);
    S.cols = tableColumns(S.rows);
    if (!S.rows.length) { renderEmpty("none"); return; }
    $("resultsHead").hidden = false;
    $("count").textContent = `${S.rows.length.toLocaleString()} result${S.rows.length === 1 ? "" : "s"}`;
    $("meta").textContent = `${fmtDay(new Date(res.start))} – ${fmtDay(new Date(res.end))} · ${res.seconds}s`;
    const lw = $("limitWarn");
    lw.hidden = !(p.mode === "simple" && S.rows.length >= p.limit);
    lw.textContent = `Showing the first ${p.limit}. Raise the limit or narrow the search.`;
    renderTable();
  } catch (e) {
    showError(String(e && e.message || e)); renderEmpty("start");
  } finally {
    clearInterval(timer); S.busy = false; btn.disabled = false; btn.textContent = "Search";
  }
}

// ---------- modals ----------
function openModal(build) {
  const m = $("modal"); m.replaceChildren(); build(m); $("overlay").hidden = false;
  const first = m.querySelector("input, textarea, select, button"); if (first) first.focus();
}
function closeModal() { $("overlay").hidden = true; }

function openGroups() {
  const s = src();
  const chosen = new Set(s.log_groups);
  let all = [];
  openModal((m) => {
    const filter = el("input", { class: "input", placeholder: "Filter, e.g. ses or ims", autocomplete: "off" });
    const list = el("div", { class: "group-list" }, el("div", { class: "group-status" }, el("span", { class: "spinner", style: "display:inline-block;vertical-align:middle" }), "  Loading log groups from AWS…"));
    const manual = el("input", { class: "input", placeholder: "Or type a log group name and press Enter", autocomplete: "off" });
    const note = el("span", { class: "note" });
    const updateNote = () => (note.textContent = `${chosen.size} selected`);
    const draw = () => {
      const f = filter.value.toLowerCase();
      const names = [...new Set([...all, ...chosen])].filter((g) => g.toLowerCase().includes(f)).sort();
      list.replaceChildren();
      if (!names.length) list.append(el("div", { class: "group-status" }, all.length ? "No log groups match that filter." : "No log groups found."));
      for (const g of names) {
        const cb = el("input", { type: "checkbox" }); cb.checked = chosen.has(g);
        cb.addEventListener("change", () => { cb.checked ? chosen.add(g) : chosen.delete(g); updateNote(); });
        list.append(el("label", { class: "group-row" }, cb, g));
      }
      updateNote();
    };
    filter.addEventListener("input", draw);
    manual.addEventListener("keydown", (e) => { if (e.key === "Enter" && manual.value.trim()) { chosen.add(manual.value.trim()); manual.value = ""; draw(); } });
    m.append(
      el("header", {}, el("h3", {}, "Log groups for " + s.label), el("p", {}, `Tick the CloudWatch log groups to search (region ${S.state.region}).`)),
      el("div", { class: "body" }, filter, list, manual),
      el("footer", {}, note, el("button", { class: "btn", onclick: closeModal }, "Cancel"),
        el("button", { class: "btn primary", onclick: async () => {
          S.state = await window.pywebview.api.set_log_groups(s.key, [...chosen]);
          closeModal(); renderSidebar(); renderTop(); renderEmpty(src().log_groups.length ? "start" : "needGroups"); toast("Log groups saved");
        } }, "Save")));
    updateNote();
    window.pywebview.api.list_log_groups("").then((res) => {
      if (res.error) { list.replaceChildren(el("div", { class: "group-status" }, res.error)); return; }
      all = res.groups; draw();
    });
  });
}

function openSettings() {
  openModal((m) => {
    const region = el("input", { class: "input", value: S.state.region, autocomplete: "off" });
    const profile = el("input", { class: "input", value: S.state.profile, placeholder: "default", autocomplete: "off" });
    const err = el("div", { class: "help", style: "color:var(--danger-text)" });
    m.append(
      el("header", {}, el("h3", {}, "AWS settings"), el("p", {}, "cw-lens uses your normal AWS login (aws configure or aws sso login).")),
      el("div", { class: "body" },
        el("div", { class: "field" }, el("label", {}, "Region"), region, el("div", { class: "help" }, "Where your logs live, e.g. us-east-1")),
        el("div", { class: "field" }, el("label", {}, "AWS profile"), profile, el("div", { class: "help" }, "Leave empty to use your default login")),
        el("div", { class: "help" }, "Settings file: " + S.state.config_path), err),
      el("footer", {}, el("button", { class: "btn", onclick: closeModal }, "Cancel"),
        el("button", { class: "btn primary", onclick: async () => {
          const res = await window.pywebview.api.set_settings(region.value, profile.value);
          if (res.error) { err.textContent = res.error; return; }
          S.state = res; closeModal(); renderSidebar(); toast("Settings saved");
        } }, "Save")));
  });
}

function applyTheme() {
  if (S.theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", S.theme);
  $("themeLabel").textContent = "Theme: " + S.theme;
}

// ---------- start ----------
async function init() {
  S.state = await window.pywebview.api.get_state();
  S.theme = store.get("theme", "auto"); applyTheme();
  const range = $("range");
  for (const r of S.state.ranges) range.append(el("option", {}, r));
  range.value = S.state.ranges.includes(store.get("range", "")) ? store.get("range") : "Last 24 hours";
  const last = store.get("source", "");
  S.source = S.state.sources.some((s) => s.key === last) ? last : S.state.sources[0].key;
  setQueryEdited(false); renderSidebar(); renderTop(); refreshPreview();
  renderEmpty(src().log_groups.length ? "start" : "needGroups");

  $("runBtn").addEventListener("click", run);
  $("term").addEventListener("keydown", (e) => { if (e.key === "Enter") run(); });
  $("term").addEventListener("input", refreshPreview);
  range.addEventListener("change", () => { store.set("range", range.value); renderTop(); refreshPreview(); });
  for (const id of ["dateFrom", "dateTo", "limit"]) $(id).addEventListener("change", refreshPreview);
  $("savedPillClear").addEventListener("click", (e) => { e.preventDefault(); S.saved = null; renderSidebar(); renderTop(); refreshPreview(); });
  $("queryToggle").addEventListener("click", () => {
    const p = $("queryPanel"); p.hidden = !p.hidden; $("queryToggle").classList.toggle("on", !p.hidden);
    if (!p.hidden) refreshPreview();
  });
  $("queryText").addEventListener("input", () => { if (!S.queryEdited) setQueryEdited(true); });
  $("queryText").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); } });
  $("bannerClose").addEventListener("click", clearError);
  $("detailsClose").addEventListener("click", closeDetails);
  $("groupsBtn").addEventListener("click", openGroups);
  $("settingsBtn").addEventListener("click", openSettings);
  $("themeBtn").addEventListener("click", () => {
    S.theme = { auto: "light", light: "dark", dark: "auto" }[S.theme]; store.set("theme", S.theme); applyTheme();
  });
  $("exportBtn").addEventListener("click", async () => {
    const res = await window.pywebview.api.export_csv();
    if (res.error) showError(res.error); else if (res.path) toast("Saved " + res.path);
  });
  $("overlay").addEventListener("mousedown", (e) => { if (e.target === $("overlay")) closeModal(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { if (!$("overlay").hidden) closeModal(); else closeDetails(); }
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (e.key === "/" && !typing) { e.preventDefault(); $("term").focus(); }
    if (!typing && S.selected >= 0 && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
      e.preventDefault();
      const n = Math.max(0, Math.min(S.rows.length - 1, S.selected + (e.key === "ArrowDown" ? 1 : -1)));
      openDetails(n); document.querySelectorAll("#table tbody tr")[n].scrollIntoView({ block: "nearest" });
    }
  });
  $("term").focus();
}
if (window.pywebview && window.pywebview.api && window.pywebview.api.get_state) init();
else window.addEventListener("pywebviewready", init, { once: true });
</script>
</body>
</html>
