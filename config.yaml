# Edit this file to point at your own AWS log groups.
# Find your log group names in the AWS console (CloudWatch > Log groups)
# or run:  python cli.py groups --prefix /aws/

region: us-east-1
profile: null            # AWS CLI profile name, or null to use default credentials

sources:
  email:
    label: Email (SES)
    # Amazon SES event log group (from the console "SES Search Logs" query)
    log_groups:
      - aws-ses-event-logs
    search_hint: email address, subject or message ID
    # Friendly columns for SES events. Searches match anywhere in the raw
    # event, so they also catch BCC and every recipient, not just the first.
    base_query: |
      fields @timestamp as Timestamp, eventType as Event,
        coalesce(bounce.bounceSubType, deliveryDelay.delayType) as Reason,
        mail.source as From, mail.commonHeaders.to.0 as To,
        mail.commonHeaders.subject as Subject, mail.messageId as MessageId
      | parse @message /(?<CC>(?<="name":"Cc","value":").+?(?="))/
    display: Timestamp, Event, Reason, From, To, CC, Subject, MessageId, @logStream, @message
    sort_by: Timestamp
    # Choices in the "Level" box for this source
    levels:
      Problems only: Event in ["Bounce", "Complaint", "Reject", "Rendering Failure", "DeliveryDelay"]
      Bounces: Event = "Bounce"
      Complaints: Event = "Complaint"
      Delivered: Event = "Delivery"
      Sent: Event = "Send"
    saved_queries:
      Find by email address (To / CC / BCC / From): |
        {base}
        | filter @message like /(?i){term}/
        | display {display}
        | sort Timestamp desc
        | limit 10000
      Find by subject: |
        {base}
        | filter Subject like /(?i){term}/
        | display {display}
        | sort Timestamp desc
        | limit 10000
      Bounces, complaints & rejects: |
        {base}
        | filter Event in ["Bounce", "Complaint", "Reject", "Rendering Failure"]
        | display {display}
        | sort Timestamp desc
        | limit 10000
      Delivery delays: |
        {base}
        | filter Event = "DeliveryDelay"
        | display {display}
        | sort Timestamp desc
        | limit 10000
      Event counts per day: |
        stats count(*) as Count by eventType, bin(1d)

  ims:
    label: IMS
    # Not set yet: the app asks you to pick IMS log groups the first time.
    log_groups: []
    search_hint: order number, SKU or error text
    # IMS (warehouse_ims Django app + Celery workers) prints lines like
    #   [2026-10-21 08:01:02,123: ERROR/MainProcess] Courier API timeout ...
    # (see LOGGING in warehouse_ims/settings.py). This splits them into
    # Level / Process / Message; lines in other formats (e.g. traceback
    # lines) keep their full text as the Message.
    base_query: |
      fields @timestamp as Timestamp, @logStream as Stream
      | parse @message /^\[(?<LogTime>[^\]]+?): (?<Level>[A-Z]+)\/(?<Process>[^\]]+)\] (?<Msg>.*)/
      | fields coalesce(Msg, @message) as Message
    display: Timestamp, Level, Process, Message, Stream, @message
    sort_by: Timestamp
    levels:
      Errors: Level in ["ERROR", "CRITICAL"]
      Warnings & errors: Level in ["WARNING", "ERROR", "CRITICAL"]
      Info: Level = "INFO"
      Background tasks: Process like /ForkPoolWorker/
    saved_queries:
      Recent errors: |
        {base}
        | filter Level in ["ERROR", "CRITICAL"]
        | display {display}
        | sort Timestamp desc
        | limit 1000
      Find by order, SKU or keyword: |
        {base}
        | filter @message like /(?i){term}/
        | display {display}
        | sort Timestamp desc
        | limit 10000
      Most common errors: |
        {base}
        | filter Level in ["ERROR", "CRITICAL"]
        | stats count(*) as Count by Message
        | sort Count desc
        | limit 50
      Crashes & tracebacks: |
        {base}
        | filter @message like /Traceback \(most recent call last\)|\b[A-Za-z]+(Error|Exception): /
        | display {display}
        | sort Timestamp desc
        | limit 1000
      Timeouts: |
        {base}
        | filter @message like /(?i)(timeout|timed out)/
        | display {display}
        | sort Timestamp desc
        | limit 1000
      Background task errors (Celery): |
        {base}
        | filter Process like /ForkPoolWorker/ and Level in ["WARNING", "ERROR", "CRITICAL"]
        | display {display}
        | sort Timestamp desc
        | limit 1000
      Errors per 5 minutes: |
        {base}
        | filter Level in ["ERROR", "CRITICAL"]
        | stats count(*) as Errors by bin(5m)
