# Builds the desktop app for Windows and macOS on every push (or manually),
# opens each build once to check the window loads, and uploads it.
# Download the results from the run's "Artifacts" section on GitHub.
name: Build desktop app
on:
  push:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m pytest -q tests

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: python -m PyInstaller --noconfirm --onefile --windowed --name cw-lens --add-data "config.yaml;." --add-data "ui;ui" webapp.py
      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Try twice: a fresh Windows runner can be slow to start WebView2 the first time.
          for ($try = 1; $try -le 2; $try++) {
            Remove-Item selftest.txt -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath "dist\cw-lens.exe" -ArgumentList "--selftest", "$PWD\selftest.txt" -PassThru
            if (-not $p.WaitForExit(200000)) { $p.Kill(); Write-Host "Attempt ${try}: app did not exit in time" }
            if (Test-Path selftest.txt) { Write-Host "Attempt ${try}: $(Get-Content selftest.txt)" }
            if ((Test-Path selftest.txt) -and (Select-String -Path selftest.txt -Pattern '^OK' -Quiet)) { exit 0 }
          }
          throw "self-test failed"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: python -m PyInstaller --noconfirm --windowed --name cw-lens --add-data "config.yaml:." --add-data "ui:ui" webapp.py
      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        run: |
          ./dist/cw-lens.app/Contents/MacOS/cw-lens --selftest "$PWD/selftest.txt" &
          pid=$!
          for i in $(seq 1 180); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          cat selftest.txt
          grep -q '^OK' selftest.txt
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: cd dist && zip -qry cw-lens-mac.zip cw-lens.app

      - uses: actions/upload-artifact@v4
        with:
          name: cw-lens-${{ runner.os }}
          path: |
            dist/cw-lens.exe
            dist/cw-lens-mac.zip
